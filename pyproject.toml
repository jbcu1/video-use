[project]
name = "video-use"
version = "0.1.0"
description = "Conversation-driven video editor skill for Claude Code"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "librosa",
    "matplotlib",
    "pillow",
    "numpy",
]

[project.optional-dependencies]
animations = ["manim"]
# Free on-device transcription instead of ElevenLabs: helpers/transcribe_local.py
local = ["faster-whisper>=1.1"]
# Speaker diarization for the local backend; needs HF_TOKEN (see transcribe_local.py)
diarize = ["pyannote.audio>=4.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
